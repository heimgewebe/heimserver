purpose: Definition of machine-readable operational boundaries for agents interacting with Heimserver infrastructure.

read_order:
  - repo.meta.yaml
  - AGENTS.md
  - SYSTEM_MAP.md
  - docs/index.md

documentation_update_rules:
  - "Changes to architecture requires explicit verification via operations."
  - "Changes to runtime.md require a preflight.sh output or a committed snapshot artifact to prove the real state."

safe_read_paths:
  - architecture/
  - runtime/
  - runbooks/
  - manifest/
  - AGENTS.md
  - repo.meta.yaml
  - SYSTEM_MAP.md

guarded_write_paths:
  - architecture/
  - runtime/
  - runbooks/
  - manifest/repo-index.yaml

forbidden_write_paths:
  - ops/audit/snapshots/
  - docker-compose.override.yml
  - .env
  - "*.key"
  - "*.pem"

external_sensitive_paths:
  - /etc/heimserver/secrets/

requires_target_proof_for:
  - runtime/
  - architecture/
  - ops/checks/

required_checks_before_patch:
  - repo-structure-guard (via check-repo-index-consistency.sh)
  - docs-relations-guard (via generate-relations.py)
  - preflight-guard (via ops/checks/preflight.sh)
  - review-age-guard (via check-doc-review-age.py)

human_review_required_for:
  - architecture/networking/
  - security/
