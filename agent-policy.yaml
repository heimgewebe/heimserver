purpose: Definition of machine-readable boundaries for preserving the retired Heimserver repository as historical evidence.

read_order:
  - repo.meta.yaml
  - AGENTS.md
  - SYSTEM_MAP.md
  - docs/index.md

documentation_update_rules:
  - "Heimserver is retired; no file in this repository may reactivate device, service, exposure, recovery or infrastructure authority."
  - "Current infrastructure truth is external: heimgewebe/infra INFRA_CONSTITUTION.md plus fresh runtime reads."
  - "Historical architecture changes require source-bound review and may not establish current infrastructure authority."
  - "runtime/ contains point-in-time historical evidence and may not be presented as current state without a new external runtime observation."

safe_read_paths:
  - architecture/
  - runtime/
  - runbooks/
  - manifest/
  - docs/
  - ops/systemd/
  - AGENTS.md
  - repo.meta.yaml
  - SYSTEM_MAP.md

guarded_write_paths:
  - architecture/
  - runtime/
  - runbooks/
  - manifest/repo-index.yaml
  - audit/impl-registry.yaml
  - ops/systemd/
  - docs/

forbidden_write_paths:
  - ops/audit/snapshots/
  - docker-compose.override.yml
  - .env
  - "*.password"
  - "*.key"
  - "*.pem"

external_sensitive_paths:
  - /etc/heimserver/secrets/
  - /etc/weltgewebe-ddns/

requires_target_proof_for:
  - runtime/
  - architecture/
  - ops/checks/

required_checks_before_patch:
  - python3 scripts/ci/check_retired_reference_contract.py
  - python3 scripts/ci/check_repo_index_consistency.py
  - python3 scripts/ci/check-doc-review-age.py
  - bash scripts/ci/check-runbook-invariants.sh
  - python3 -m unittest scripts/tests/test_weltgewebe_ddns.py
  - bash scripts/tests/test_ddns_bundle.sh

artifact_refresh_steps:
  - python3 scripts/generate-relations.py
  - python3 scripts/generate-system-map.py
  - python3 scripts/docmeta/generate-architecture-drift.py
  - python3 scripts/docmeta/generate-doc-coverage.py
  - python3 scripts/docmeta/generate-knowledge-gaps.py
  - python3 scripts/docmeta/generate-agent-readiness.py

human_review_required_for:
  - architecture/networking/
  - security/
