purpose: Definition of machine-readable operational boundaries for agents interacting with Heimserver infrastructure.

read_order:
  - repo.meta.yaml
  - AGENTS.md
  - SYSTEM_MAP.md
  - docs/index.md

documentation_update_rules:
  - "Changes to architecture requires explicit verification via operations."
  - "Changes to runtime.md require a preflight.sh output or a committed snapshot artifact to prove the real state."

safe_read_paths:
  - architecture/
  - runtime/
  - runbooks/
  - manifest/
  - docs/
  - AGENTS.md
  - repo.meta.yaml
  - SYSTEM_MAP.md

guarded_write_paths:
  - architecture/
  - runtime/
  - runbooks/
  - manifest/repo-index.yaml
  - docs/

forbidden_write_paths:
  - ops/audit/snapshots/
  - docker-compose.override.yml
  - .env
  - "*.key"
  - "*.pem"

external_sensitive_paths:
  - /etc/heimserver/secrets/

requires_target_proof_for:
  - runtime/
  - architecture/
  - ops/checks/

required_checks_before_patch:
  - python3 scripts/ci/check_repo_index_consistency.py
  - bash ops/checks/preflight.sh
  - python3 scripts/ci/check-doc-review-age.py
  - bash scripts/ci/check-runbook-invariants.sh

artifact_refresh_steps:
  - python3 scripts/generate-relations.py
  - python3 scripts/generate-system-map.py
  - python3 scripts/docmeta/generate-architecture-drift.py
  - python3 scripts/docmeta/generate-doc-coverage.py
  - python3 scripts/docmeta/generate-knowledge-gaps.py
  - python3 scripts/docmeta/generate-agent-readiness.py

human_review_required_for:
  - architecture/networking/
  - security/
