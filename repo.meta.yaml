repo_name: heimserver
repo_type: ops
role: Historische Betriebs- und Vertragsreferenz
status: retired-reference
summary: >
  Historical private reference for the former Heimserver service layer, deployment contracts,
  security reasoning and runtime evidence. It has no active device, service, exposure, recovery
  or infrastructure authority; current infrastructure truth is owned by heimgewebe/infra.

primary_languages:
  - markdown
  - bash
  - python

entrypoints:
  - README.md
  - AGENTS.md
  - SYSTEM_MAP.md
  - docs/index.md

canonical_sources:
  - repo.meta.yaml
  - manifest/repo-index.yaml
  - docs/index.md

historical_reference_sources:
  - architecture/
  - runtime/
  - operations/
  - runbooks/
  - ops/

discovery_roots:
  - architecture/
  - runtime/
  - operations/
  - runbooks/
  - docs/
  - ops/

generated_artifacts:
  - SYSTEM_MAP.md
  - docs/_generated/doc-index.md
  - docs/_generated/relations.json
  - docs/_generated/backlinks.md
  - docs/_generated/orphans.md
  - docs/_generated/impl-index.md
  - docs/_generated/supersession-map.md
  - docs/_generated/architecture-drift.md
  - docs/_generated/doc-coverage.md
  - docs/_generated/knowledge-gaps.md
  - docs/_generated/agent-readiness.md

safe_read_paths:
  - README.md
  - AGENTS.md
  - runbooks/
  - manifest/
  - docs/
  - repo.meta.yaml
  - SYSTEM_MAP.md

guarded_write_paths:
  - runbooks/
  - manifest/repo-index.yaml
  - ops/checks/
  - ops/systemd/
  - scripts/
  - docs/

forbidden_write_paths:
  - docs/_generated/
  - docker-compose.override.yml
  - ops/audit/snapshots/**
  - "**/*.password"

external_sensitive_paths:
  - /etc/heimserver/secrets/
  - /etc/weltgewebe-ddns/

required_checks:
  - python3 scripts/ci/check_retired_reference_contract.py
  - python3 scripts/ci/check_repo_index_consistency.py
  - python3 scripts/ci/check-doc-review-age.py
  - bash scripts/ci/check-runbook-invariants.sh
  - python3 -m unittest scripts/tests/test_weltgewebe_ddns.py
  - bash scripts/tests/test_ddns_bundle.sh

indexing:
  enabled: true
  require_frontmatter_for_docs: true
  require_registry_for_critical_impl: true
  fail_on_untyped_docs: true
  fail_on_missing_doc_index: false
  fail_on_orphans: false
  fail_on_unmapped_critical_impl: false

related_repos:
  - weltgewebe
  - leitstand

keywords:
  - historical-reference
  - retired
  - infrastructure-history
  - contract-evidence
  - private-archive
