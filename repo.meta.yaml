repo_name: heimserver
repo_type: ops
role: Ops-Orakel, Trust-Pivot, Edge-Gateway-Konfiguration
status: active
summary: >
  Operational deployment, enforcement, and health monitoring of the Weltgewebe application stack.
  Defines the canonical truth for infrastructure, networking, and security boundaries.

primary_languages:
  - markdown
  - bash
  - python

entrypoints:
  - README.md
  - AGENTS.md
  - SYSTEM_MAP.md
  - docs/index.md

canonical_sources:
  - repo.meta.yaml
  - manifest/repo-index.yaml
  - architecture/
  - runtime/
  - ops/checks/preflight.sh
  - docs/index.md

discovery_roots:
  - architecture/
  - runtime/
  - operations/
  - runbooks/
  - docs/
  - ops/

generated_artifacts:
  - SYSTEM_MAP.md
  - docs/_generated/doc-index.md
  - docs/_generated/relations.json
  - docs/_generated/backlinks.md
  - docs/_generated/orphans.md
  - docs/_generated/impl-index.md
  - docs/_generated/supersession-map.md
  - docs/_generated/architecture-drift.md
  - docs/_generated/doc-coverage.md
  - docs/_generated/knowledge-gaps.md
  - docs/_generated/agent-readiness.md

safe_read_paths:
  - README.md
  - AGENTS.md
  - architecture/
  - runtime/
  - runbooks/
  - manifest/
  - docs/
  - repo.meta.yaml
  - SYSTEM_MAP.md

guarded_write_paths:
  - architecture/
  - runtime/
  - runbooks/
  - manifest/repo-index.yaml
  - ops/checks/
  - scripts/
  - docs/

forbidden_write_paths:
  - docs/_generated/
  - docker-compose.override.yml
  - ops/audit/snapshots/**

external_sensitive_paths:
  - /etc/heimserver/secrets/

required_checks:
  - bash ops/checks/preflight.sh
  - python3 scripts/ci/check_repo_index_consistency.py
  - python3 scripts/ci/check-doc-review-age.py
  - bash scripts/ci/check-runbook-invariants.sh

indexing:
  enabled: true
  require_frontmatter_for_docs: true
  require_registry_for_critical_impl: true
  fail_on_untyped_docs: true
  fail_on_missing_doc_index: false
  fail_on_orphans: false
  fail_on_unmapped_critical_impl: false

related_repos:
  - weltgewebe
  - leitstand

keywords:
  - ops
  - infrastructure
  - edge
  - gateway
  - agent-ready
